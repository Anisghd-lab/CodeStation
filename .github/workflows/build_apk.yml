name: Build Synapse Android Native APK

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK Artifact
        run: |
          mkdir -p output_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk output_artifacts/Synapse-v1.0.0-debug.apk
          cd output_artifacts
          sha256sum Synapse-v1.0.0-debug.apk > Synapse-v1.0.0-debug.apk.sha256
          cat Synapse-v1.0.0-debug.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-v1.0.0-debug-apk
          path: |
            output_artifacts/Synapse-v1.0.0-debug.apk
            output_artifacts/Synapse-v1.0.0-debug.apk.sha256
          retention-days: 14

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
