name: Build CodeStation Android Native APK

on:
  push:
    branches: [ main, master, feature/**, fix/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK Artifact
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          mkdir -p output_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "output_artifacts/CodeStation-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk output_artifacts/CodeStation-debug.apk
          cd output_artifacts
          sha256sum CodeStation-debug.apk "CodeStation-v${VERSION_NAME}-debug.apk" > CodeStation-debug.apk.sha256
          cat CodeStation-debug.apk.sha256

      - name: Verify stable signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs output_artifacts/CodeStation-debug.apk | tee signer.txt
          grep -qi "3a57a1a45a53bfc51b8ec13b4ebfa2bb25205f3fba7dff22c5a29dfd3abb4e8b" signer.txt \
            || { echo "::error::APK not signed with the stable CodeStation debug key"; exit 1; }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeStation-v${{ env.VERSION_NAME }}-debug-apk
          path: |
            output_artifacts/CodeStation-v${{ env.VERSION_NAME }}-debug.apk
            output_artifacts/CodeStation-debug.apk
            output_artifacts/CodeStation-debug.apk.sha256
          retention-days: 14

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
